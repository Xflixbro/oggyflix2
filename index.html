<html lang="en">
<head>
 <meta charset="UTF-8">

 <title>Security Gateway</title>
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: Arial, Helvetica, sans-serif;
 }
 html,
 body {
 width: 100%;
 min-height: 100%;
 }

 min-height: 100vh;

 justify-content: center;

 /* =========================
 BACKGROUND PARTICLES
 ========================= */

 height: 100%;

 }

 content: "";

 inset: 0;

 /* =========================
 MAIN CARD
 ========================= */
 .card {
 width: 100%;
 max-width: 620px;
 min-height: 720px;
 border: 1px solid rgba(0, 255, 255, 0.38);

 radial-gradient(
 circle at 50% 25%,

 ),

 justify-content: center;
 align-items: center;

 height: 218px;

 box-shadow:

 border-radius: 50%;
 border: 5px solid #00eaff;

 from {

 }
 to {
 transform: rotate(360deg);

 CONTENT
 ========================= */

 width: 100%;

 align-items: center;

 font-weight: 800;

 }

 }

 opacity: 0.6;
 cursor: not-allowed;
 }

 STATUS
 ========================= */

 font-size: 18px;

 letter-spacing: 2px;

 height: 22px;

 }

<body>
 <canvas id="particle-canvas"></canvas>
 <div class="card" id="card">
 <div class="logo-container">
 <img
 id="gateway-logo"
 class="gateway-logo"

 >

 <div id="dynamic-content"></div>
 <div id="debug-console"></div>
 </div>
 <script>
 (function () {
 const canvas =
 document.getElementById("particle-canvas");
 if (!canvas) return;
 const ctx =
 canvas.getContext("2d");
 function resize() {
 canvas.width =
 window.innerWidth;
 canvas.height =
 window.innerHeight;
 }
 resize();
 window.addEventListener(
 "resize",
 resize
 );
 const particles = [];
 for (let i = 0; i < 90; i++) {
 particles.push({
 x:
 Math.random()
 * canvas.width,
 y:
 Math.random()
 * canvas.height,
 radius:
 Math.random() * 2 + 0.5,
 speedX:
 (Math.random() - 0.5)
 * 0.35,
 speedY:
 (Math.random() - 0.5)
 * 0.35,
 alpha:
 Math.random()
 * 0.65 + 0.2
 });
 }
 function animate() {
 ctx.clearRect(
 0,
 0,
 canvas.width,
 canvas.height
 );
 particles.forEach(p => {
 p.x += p.speedX;
 p.y += p.speedY;
 if (p.x < 0)
 p.x = canvas.width;
 if (p.x > canvas.width)
 p.x = 0;
 if (p.y < 0)
 p.y = canvas.height;
 if (p.y > canvas.height)
 p.y = 0;
 ctx.beginPath();
 ctx.arc(
 p.x,
 p.y,
 p.radius,
 0,
 Math.PI * 2
 );
 ctx.fillStyle =
 `rgba(220,240,255,${p.alpha})`;
 ctx.shadowBlur = 8;
 ctx.shadowColor =
 "#ffffff";
 ctx.fill();
 });
 requestAnimationFrame(animate);
 }
 animate();
 })();
 </script>
 <script>
 (function () {
 "use strict";
 const CONFIG = {
 API_BASE:
 "https://wee-dot-yedhuku2004-543d97f6.koyeb.app",
 COUNTDOWN_SECONDS: 3
 };
 const DEBUG =
 window.location.hash === "#debug";
 function log(...args) {
 if (!DEBUG)
 return;
 console.log(
 "[GW]",
 ...args
 );
 const d =
 document.getElementById(
 "debug-console"
 );
 if (d) {
 d.style.display =
 "block";
 d.innerHTML +=
 "<div>" +
 args
 .map(String)
 .join(" ") +
 "</div>";
 }
 }
 const dynamicDiv =
 document.getElementById(
 "dynamic-content"
 );
 const card =
 document.getElementById(
 "card"
 );
 /* =========================
 BASE64 URL DECODE
 ========================= */
 function base64UrlDecode(s) {
 s =
 s.replace(
 /-/g,
 "+"
 )
 .replace(
 /_/g,
 "/"
 );
 while (
 s.length % 4
 ) {
 s += "=";
 }
 return atob(s);
 }
 /* =========================
 ROUTING
 ========================= */
 const path =
 window.location.pathname;
 const urlParams =
 new URLSearchParams(
 window.location.search
 );
 /*
 * /access/{token}?url=...
 */
 if (
 path.startsWith(
 "/access/"
 )
 ) {
 const hexToken =
 path.split("/")[2]
 || "";
 const encodedUrl =
 urlParams.get("url");
 if (!hexToken) {
 showInvalid();
 return;
 }
 let shortenerUrl;
 try {
 shortenerUrl =
 base64UrlDecode(
 encodedUrl
 );
 } catch (e) {
 showInvalid();
 return;
 }
 if (
 !shortenerUrl
 .startsWith("http")
 ) {
 showInvalid();
 return;
 }
 routeAccess(
 hexToken,
 shortenerUrl
 );
 return;
 }
 /*
 * /s?h=...&a=...&b=...
 */
 if (
 path === "/s" ||
 path.startsWith("/s/")
 ) {
 const h =
 urlParams.get("h");
 const a =
 urlParams.get("a");
 const b =
 urlParams.get("b")
 || "eonxstBot";
 if (!h || !a) {
 showInvalid();
 return;
 }
 routeGranted(
 h,
 a,
 b
 );
 return;
 }
 /*
 * Legacy /
 */
 routeLegacy();
 return;
 /* =========================
 LEGACY
 ========================= */
 function routeLegacy() {
 dynamicDiv.innerHTML = `
 <h1>
 SECURITY<br>
 GATEWAY
 </h1>
 <p class="subtitle">
 Verification required to establish a secure tunnel.
 Automated scripts are restricted.
 </p>
 <div class="error-message">
 <h3>
 Invalid or missing link
 </h3>
 <p>
 The URL does not contain
 a recognised file reference.
 </p>
 </div>
 `;
 }
 /* =========================
 ACCESS ROUTE
 ========================= */
 function routeAccess(
 hexToken,
 shortenerUrl
 ) {
 const apiBase =
 CONFIG.API_BASE
 .replace(/\/+$/, "");
 fetch(
 `${apiBase}/api/verify_token?token=${encodeURIComponent(hexToken)}`
 )
 .then(r => r.json())
 .then(d => {
 log(
 "verify_token:",
 d
 );
 if (
 d.status === "OK"
 ) {
 if (
 d.verification_enabled
 === false
 ) {
 showDirectRedirect(
 d.bot_link
 || shortenerUrl,
 hexToken,
 apiBase
 );
 } else {
 showGateway(
 hexToken,
 apiBase,
 shortenerUrl,
 d
 );
 }
 }
 else if (
 d.status === "INVALID" ||
 d.status === "EXPIRED" ||
 d.status === "REUSED"
 ) {
 showError(
 d.reason
 ||
 "Invalid or expired link"
 );
 }
 else if (
 d.status === "BYPASS"
 ) {
 showBypass(
 d.reason,
 d.bot_link
 || shortenerUrl
 );
 }
 else {
 showError(
 "Unknown response from server"
 );
 }
 })
 .catch(err => {
 log(
 "API error:",
 err
 );
 /*
 * Keep the existing behaviour:
 * if the API cannot be reached,
 * show the verification gateway.
 */
 showGateway(
 hexToken,
 apiBase,
 shortenerUrl,
 {}
 );
 });
 }
 /* =========================
 SECURITY GATEWAY
 ========================= */
 function showGateway(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 ) {
 card.classList.remove(
 "bypass-theme"
 );
 dynamicDiv.innerHTML = `
 <h1>
 SECURITY<br>
 GATEWAY
 </h1>
 <p class="subtitle">
 Verification required to establish a
 secure tunnel. Automated scripts are restricted.
 </p>
 <button
 class="btn-primary"
 id="verifyBtn"
 >
 VERIFY IDENTITY
 </button>
 `;
 document
 .getElementById("verifyBtn")
 .onclick = function () {
 startVerification(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 );
 };
 }
 /* =========================
 VERIFICATION
 ========================= */
 function startVerification(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 ) {
 fetch(
 `${apiBase}/api/mark_gateway_opened?token=${encodeURIComponent(hexToken)}`
 )
 .catch(() => {});
 dynamicDiv.innerHTML = `
 <h1>
 SECURITY<br>
 GATEWAY
 </h1>
 <p class="subtitle">
 Verification required to establish a
 secure tunnel. Automated scripts are restricted.
 </p>
 <button
 class="btn-primary"
 disabled
 >
 VERIFYING...
 <span id="countdown">
 ${CONFIG.COUNTDOWN_SECONDS}
 </span>
 </button>
 `;
 let counter =
 CONFIG.COUNTDOWN_SECONDS;
 const el =
 document.getElementById(
 "countdown"
 );
 const iv =
 setInterval(
 () => {
 counter--;
 if (el) {
 el.textContent =
 counter;
 }
 if (
 counter <= 0
 ) {
 clearInterval(iv);
 showRouting(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 );
 }
 },
 1000
 );
 }
 /* =========================
 ROUTING SCREEN
 ========================= */
 function showRouting(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 ) {
 dynamicDiv.innerHTML = `
 <h1>
 SECURITY<br>
 GATEWAY
 </h1>
 <p class="subtitle">
 Verification completed successfully.
 </p>
 <button
 class="btn-primary"
 disabled
 >
 ROUTING SECURELY...
 </button>
 `;
 setTimeout(
 () => {
 showProceed(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 );
 },
 1000
 );
 }
 /* =========================
 PROCEED
 ========================= */
 function showProceed(
 hexToken,
 apiBase,
 shortenerUrl,
 info
 ) {
 const target =
 info &&
 info.shortener_url
 ? info.shortener_url
 : shortenerUrl;
 dynamicDiv.innerHTML = `

 GATEWAY
 </h1>
 <p class="subtitle">

 Continue to access the requested content.

 <button

 PROCEED

 `;
 document

 fetch(

 )
 .catch(() => {});
 window.location.href =
 target;
 };
 }

 card.classList.remove(

 /* =========================

 b
